<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Dagbriefing</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{overflow-x:hidden}.shell{width:min(100%,480px);margin:auto;padding:12px 12px 24px}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin:2px 2px 10px}.top h1{font-size:20px;line-height:1.08;margin:0}.date{color:#19a8ff;font-weight:850;font-size:11px;line-height:1.3;text-align:right;white-space:nowrap}.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.track::-webkit-scrollbar{display:none}.card{flex:0 0 100%;height:min(720px,calc(100dvh - 124px));min-height:620px;background:#0b0e13;border:1px solid #1d2530;border-radius:22px;overflow:hidden;scroll-snap-align:center;display:flex;flex-direction:column}.hero{height:39%;min-height:220px;position:relative;overflow:hidden;background:#0b1520;flex:0 0 auto}.hero:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 55%,rgba(5,7,10,.92))}.art{position:absolute;inset:0}.art img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#0b1520}.badge{position:absolute;z-index:2;top:13px;left:13px;background:rgba(5,7,10,.94);padding:8px 11px;border-radius:8px;font-size:11px;font-weight:900;letter-spacing:.055em}.content{flex:1;min-height:0;padding:12px 17px 14px;display:flex;flex-direction:column;overflow:hidden}.content h2{font-size:clamp(24px,6.6vw,30px);line-height:1.04;margin:0 0 9px;font-weight:900;letter-spacing:-.03em}.content p{font-size:15.5px;line-height:1.36;color:#e7edf4;margin:0}.content p strong{color:#66c1ff}.facts{margin-top:auto;border-top:1px solid #26303c;padding-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:#b8c2cd}.facts b{color:#19a8ff;display:block;font-size:13px}.card-source{display:inline-flex;align-items:center;align-self:flex-start;margin-top:9px;color:#8ed1ff;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #24445d;background:#0b1721;padding:7px 10px;border-radius:999px}.nav{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:9px}.nav button{border:1px solid #344050;background:#11161d;color:#fff;border-radius:999px;padding:7px 13px;font-weight:750}.dots{display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:#46515e}.dot.on{width:18px;border-radius:8px;background:#19a8ff}.hint{text-align:center;color:#8e9baa;font-size:11px;margin-top:5px}.error{padding:24px;color:#ffb4b4}@media(max-width:420px){.shell{padding-left:9px;padding-right:9px}.top{grid-template-columns:1fr}.date{text-align:left;white-space:normal}.card{min-height:620px;height:min(720px,calc(100dvh - 142px))}.hero{height:37%;min-height:210px}.content{padding:12px 15px 13px}.content h2{font-size:26px}.content p{font-size:15px}}
</style></head><body><main class="shell"><header class="top"><h1>Dagelijkse interessebriefing</h1><div class="date"><div id="contentTime">LADEN…</div><div id="deployTime"></div></div></header><section class="track" id="track"></section><div class="nav"><button id="prev">‹</button><div class="dots" id="dots"></div><button id="next">›</button></div><div class="hint">Swipe →</div></main><script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=document.getElementById('track'),d=document.getElementById('dots');
let cards=[];
function nav(){d.innerHTML='';cards=[...t.querySelectorAll('.card')];cards.forEach((_,i)=>{const x=document.createElement('span');x.className='dot'+(i?'':' on');d.appendChild(x)});}
function ix(){return Math.max(0,Math.min(cards.length-1,Math.round(t.scrollLeft/(t.clientWidth+12))))}
function sy(){[...d.children].forEach((x,i)=>x.classList.toggle('on',i===ix()))}
function go(n){if(cards.length)cards[Math.max(0,Math.min(cards.length-1,n))].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
t.addEventListener('scroll',()=>requestAnimationFrame(sy));prev.onclick=()=>go(ix()-1);next.onclick=()=>go(ix()+1);
fetch('briefing.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(b=>{
 if(!b.cards||b.cards.length!==10)throw Error('ongeldige kaartset');
 document.title=b.title||'Dagbriefing';document.getElementById('contentTime').textContent=b.content_time||'';document.getElementById('deployTime').textContent=b.deployment_time||'';
 t.innerHTML=b.cards.map(c=>'<article class="card"><div class="hero"><div class="art"><img src="'+E(c.image.src)+'" alt="'+E(c.image.alt)+'"></div><div class="badge">'+E(c.n)+'/10 · '+E(c.category)+'</div></div><div class="content"><h2>'+E(c.headline)+'</h2><p>'+String(c.summary_html||'')+'</p><div class="facts"><span><b>'+E(c.facts[0].value)+'</b>'+E(c.facts[0].label)+'</span><span><b>'+E(c.facts[1].value)+'</b>'+E(c.facts[1].label)+'</span></div><a class="card-source" href="'+E(c.source.url)+'" target="_blank" rel="noopener">'+E(c.source.label)+'</a></div></article>').join('');
 nav();
}).catch(e=>{t.innerHTML='<div class="error">Dagbriefing kon niet worden geladen.</div>';document.getElementById('contentTime').textContent='LAADFOUT';});
</script></body></html>
