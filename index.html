*{box-sizing:border-box}html,body{margin:0;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{overflow-x:hidden}.shell{width:min(100%,480px);margin:auto;padding:12px 12px 24px}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin:2px 2px 10px}.top h1{font-size:20px;line-height:1.08;margin:0}.date{color:#19a8ff;font-weight:850;font-size:11px;line-height:1.3;text-align:right;white-space:nowrap}.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.track::-webkit-scrollbar{display:none}.card{flex:0 0 100%;height:min(720px,calc(100dvh - 124px));min-height:620px;background:#0b0e13;border:1px solid #1d2530;border-radius:22px;overflow:hidden;scroll-snap-align:center;display:flex;flex-direction:column}.hero{height:39%;min-height:220px;position:relative;overflow:hidden;background:#0b1520;flex:0 0 auto}.hero:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 55%,rgba(5,7,10,.92))}.art{position:absolute;inset:0}.art img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#0b1520}.badge{position:absolute;z-index:2;top:13px;left:13px;background:rgba(5,7,10,.94);padding:8px 11px;border-radius:8px;font-size:11px;font-weight:900;letter-spacing:.055em}.content{flex:1;min-height:0;padding:12px 17px 14px;display:flex;flex-direction:column;overflow:hidden}.content h2{font-size:clamp(24px,6.6vw,30px);line-height:1.04;margin:0 0 9px;font-weight:900;letter-spacing:-.03em}.content p{font-size:15.5px;line-height:1.36;color:#e7edf4;margin:0}.content p strong{color:#66c1ff}.facts{margin-top:auto;border-top:1px solid #26303c;padding-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:#b8c2cd}.facts b{color:#19a8ff;display:block;font-size:13px}.card-source{display:inline-flex;align-items:center;align-self:flex-start;margin-top:9px;color:#8ed1ff;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #24445d;background:#0b1721;padding:7px 10px;border-radius:999px}.nav{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:9px}.nav button{border:1px solid #344050;background:#11161d;color:#fff;border-radius:999px;padding:7px 13px;font-weight:750}.dots{display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:#46515e}.dot.on{width:18px;border-radius:8px;background:#19a8ff}.hint{text-align:center;color:#8e9baa;font-size:11px;margin-top:5px}.error{padding:24px;color:#ffb4b4}@media(max-width:420px){.shell{padding-left:9px;padding-right:9px}.top{grid-template-columns:1fr}.date{text-align:left;white-space:normal}.card{min-height:620px;height:min(720px,calc(100dvh - 142px))}.hero{height:37%;min-height:210px}.content{padding:12px 15px 13px}.content h2{font-size:26px}.content p{font-size:15px}}
</style></head><body><main class="shell"><header class="top"><h1>Dagelijkse interessebriefing</h1><div class="date"><div id="contentTime">LADEN…</div><div id="deployTime"></div></div></header><section class="track" id="track"></section><div class="nav"><button id="prev">‹</button><div class="dots" id="dots"></div><button id="next">›</button></div><div class="hint">Swipe →</div></main><script>

const t=document.getElementById('track'),d=document.getElementById('dots');
let cards=[];
function nav(){d.innerHTML='';cards=[...t.querySelectorAll('.card')];cards.forEach((_,i)=>{const x=document.createElement('span');x.className='dot'+(i?'':' on');d.appendChild(x)});}
function ix(){return Math.max(0,Math.min(cards.length-1,Math.round(t.scrollLeft/(t.clientWidth+12))))}
function sy(){[...d.children].forEach((x,i)=>x.classList.toggle('on',i===ix()))}
function go(n){if(cards.length)cards[Math.max(0,Math.min(cards.length-1,n))].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
t.addEventListener('scroll',()=>requestAnimationFrame(sy));prev.onclick=()=>go(ix()-1);next.onclick=()=>go(ix()+1);

als beeld bij de financiële zaak rond Manchester City"}},{"n":3,"category":"FILM & FESTIVALS","headline":"Stemronde Gouden Kalveren sluit, gala vrijdag","summary_html":"De laatste Academy-stemronde voor de <strong>Gouden Kalveren 2026</strong> sluit vannacht om 23.59 uur. De genomineerde films zijn tijdens het NFF nog op het witte doek te zien. De winnaars worden vrijdag bekendgemaakt tijdens het EY Gouden Kalveren Gala.","facts":[{"value":"13 CATEGORIEËN","label":"Academy-stemronde"},{"value":"2 OKT","label":"EY Gouden Kalveren Gala"}],"source":{"url":"https://www.filmfestival.nl/festival/gouden-kalveren","label":"Bron · Nederlands Film Festival ↗"},"image":{"src":"https://www.broadcastmagazine.nl/wp-content/uploads/2026/09/talentawards1020.jpg","alt":"Nederlands Film Festival 2026 in Utrecht"}},{"n":4,"category":"TECHNOLOGIE & GADGETS","headline":"Lenovo lanceert Googlebook van 1499 euro","summary_html":"Lenovo heeft de <strong>Googlebook 15</strong> aangekondigd, een premiumlaptop met een aangepaste versie van Android. Het model krijgt een Intel Core Ultra 5, een 15-inch 2,8K-oledscherm en een opgegeven accuduur tot 12,5 uur. De Nederlandse vanafprijs bedraagt 1499 euro.","facts":[{"value":"€1499","label":"Vanafprijs"},{"value":"12,5 UUR","label":"Opgegeven accuduur"}],"source":{"url":"https://tweakers.net/nieuws/252704/lenovo-komt-met-duurste-googlebook-tot-nu-toe-1499-euro-voor-android-laptop.html","label":"Bron · Tweakers ↗"},"image":{"src":"https://www.instalki.pl/wp-content/uploads/2026/09/Lenovo-googlebook-premiera.jpg","alt":"Lenovo Googlebook 15, de nieuwe Android-laptop van Lenovo"}},{"n":5,"category":"AI HEADLINES","headline":"Anthropic waarschuwt zelf voor existentiële AI-risico’s","summary_html":"Anthropic besteedt in zijn IPO-prospectus uitzonderlijk veel aandacht aan de mogelijke gevaren van geavanceerde AI. Het bedrijf noemt onder meer autonome systemen die zich aan uitschakeling kunnen onttrekken en waarschuwt voor <strong>catastrofale of existentiële risico’s</strong>. Tegelijk plant het bedrijf enorme investeringen in rekeninfrastructuur.","facts":[{"value":"80 PAGINA’S","label":"Risicoparagraaf prospectus"},{"value":"6%","label":"Rekencapaciteit voor veiligheid in steekproefweek"}],"source":{"url":"https://www.reuters.com/business/finance/anthropic-warns-ai-may-pose-existential-risks-humanity-ipo-filing-2026-09-29/","label":"Bron · Reuters ↗"},"image":{"src":"https://img.iex.nl/uploads/Reuters/2026/09/20260929-KBN3VF0YW.jpg","alt":"AI-infrastructuur bij berichtgeving over Anthropic"}},{"n":6,"category":"WATERSPORT","headline":"Luna Rossa domineert America’s Cup-voorronde in Napels","summary_html":"Luna Rossa heeft de slotdag van de Louis Vuitton 38th America’s Cup Preliminary Regatta in Napels overtuigend gewonnen. De Italianen pakten de laatste <strong>twee vlootraces</strong> en versloegen daarna Emirates Team New Zealand in de matchracefinale. Er stond 11 tot 14 knopen wind.","facts":[{"value":"2 ZEGES","label":"Laatste vlootraces"},{"value":"11–14 KTS","label":"Wind in Napels"}],"source":{"url":"https://www.sailing.org/2026/09/28/luna-rossa-score-outstanding-statement-win-in-naples/","label":"Bron · World Sailing ↗"},"image":{"src":"https://www.sailing.org/wp-content/uploads/2026/09/m32564_AC38_260927_IR200463-1.jpg","alt":"Luna Rossa in actie tijdens de America’s Cup Preliminary Regatta in Napels"}},{"n":7,"category":"GWW","headline":"EIB: achterstallig onderhoud infra kan 20 miljard kosten","summary_html":"Achterstallig onderhoud aan bruggen en sluizen kan de Nederlandse economie volgens het Economisch Instituut voor de Bouw <strong>20 miljard euro</strong> kosten als aanvullend beleid uitblijft. De schade komt vooral door hogere transportkosten en omvaren. Het EIB noemt jaarlijks circa 3 miljard euro extra nodig.","facts":[{"value":"€20 MLD","label":"Mogelijke economische schade"},{"value":"€3 MLD/JAAR","label":"Volgens EIB nodig"}],"source":{"url":"https://www.bnr.nl/nieuws/bouw-infrastructuur/10611403/onderzoek-achterstallig-onderhoud-infrastructuur-kost-20-miljard-euro","label":"Bron · BNR / EIB ↗"},"image":{"src":"https://bnr-external-prod.imgix.net/882948-883325.jpeg?q=45&w=1500&auto=format,compress","alt":"Nederlandse brug als illustratie bij achterstallig onderhoud aan infrastructuur"}},{"n":8,"category":"ROTTERDAM HEADLINES","headline":"Avondafsluitingen op Abram van Rijckevorselweg","summary_html":"Rotterdam vervangt tot en met 3 oktober het asfalt op de Abram van Rijckevorselweg. Deze week is de weg op meerdere avonden en nachten <strong>van 20.00 tot 06.00 uur</strong> afgesloten vanaf het Kralingseplein. Ook wordt gewerkt aan de afrit Kralingse Zoom, met lokale omleidingen.","facts":[{"value":"20:00–06:00","label":"Avond- en nachtafsluiting"},{"value":"T/M 3 OKT","label":"Werkzaamheden"}],"source":{"url":"https://www.rotterdam.nl/vervanging-asfalt-abram-van-rijckevorselweg","label":"Bron · Gemeente Rotterdam ↗"},"image":{"src":"https://backend-dvg.rotterdam.nl/sites/default/files/2026-07/30054-viaduct-kralingse-zoom-over-abram-van-rijckevorselweg-robin-utrecht-1920x1080.jpg?tr=w-1200,h-627","alt":"Viaduct Kralingse Zoom boven de Abram van Rijckevorselweg in Rotterdam"}},{"n":9,"category":"MUZIEK & CONCERTEN","headline":"Mamas Gun woensdagavond in Annabel","summary_html":"De Britse soulband <strong>Mamas Gun</strong> speelt woensdag 30 september in Annabel in Rotterdam. De band rond Andy Platts brengt soul, funk en jazz en presenteert het nieuwe album <em>DIG!</em>. Het concert wordt georganiseerd in samenwerking met onder meer Rotown en BIRD.","facts":[{"value":"20:00","label":"Start concert"},{"value":"€30","label":"Ticket incl. servicekosten"}],"source":{"url":"https://www.rotown.nl/agenda/mamas-gun-1/","label":"Bron · Rotown ↗"},"image":{"src":"https://www.rotown.nl/wp-content/uploads/2026/05/Mamas-Gun-Declan-Haughian_20250904-r001-007-Fb-event.jpg","alt":"Mamas Gun, op 30 september live in Annabel Rotterdam"}},{"n":10,"category":"WEER ROTTERDAM","headline":"Woensdag eerst zon, later grotere kans op buien","summary_html":"Na de zomers warme dinsdag begint woensdag in Rotterdam met ruimte voor de zon, maar later neemt de kans op buien duidelijk toe. Het KNMI verwacht landelijk een <strong>hoge neerslagkans</strong> en een matige zuidoostenwind. Er zijn geen weerwaarschuwingen van kracht.","facts":[{"value":"90%","label":"Landelijke neerslagkans"},{"value":"ZO 3 BFT","label":"Verwachte wind"}],"source":{"url":"https://www.knmi.nl/home","label":"Bron · KNMI ↗"},"image":{"src":"https://images.cdn.nos.nl/3/3/q/L/F/S/rnDzzD2Baz8QMoC7KyoXyQiuMacmNiNyTjjPsKN/0x114x4000x2250-1280x720.webp","alt":"Wolken en opklaringen bij warm septemberweer"}}]};
