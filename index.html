:9px;color:#8ed1ff;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #24445d;background:#0b1721;padding:7px 10px;border-radius:999px}.nav{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:9px}.nav button{border:1px solid #344050;background:#11161d;color:#fff;border-radius:999px;padding:7px 13px;font-weight:750}.dots{display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:#46515e}.dot.on{width:18px;border-radius:8px;background:#19a8ff}.hint{text-align:center;color:#8e9baa;font-size:11px;margin-top:5px}.error{padding:24px;color:#ffb4b4}@media(max-width:420px){.shell{padding-left:9px;padding-right:9px}.top{grid-template-columns:1fr}.date{text-align:left;white-space:normal}.card{min-height:620px;height:min(720px,calc(100dvh - 142px))}.hero{height:37%;min-height:210px}.content{padding:12px 15px 13px}.content h2{font-size:26px}.content p{font-size:15px}}

const t=document.getElementById('track'),d=document.getElementById('dots');

const b={"schema_version":1,"title":"Dagbriefing 9 oktober 2026","content_time":"9 OKT 2026 · 17:37","deployment_time":"BIJGEWERKT · 9 OKT 2026 · 17:37","cards":[{"n":1,"category":"NIEUWS HEADLINES","headline":"Bonden kondigen landelijke busstaking aan","summary_html":"CNV en FNV hebben op 9 oktober een <strong>landelijke staking op woensdag 14 oktober</strong> aangekondigd na vastgelopen cao-overleg. Het conflict gaat onder meer over roosters, pauzes en loondoorbetaling bij ziekte. De cao betreft ongeveer 13.000 werknemers. Het stadsvervoer in Amsterdam, Den Haag en Rotterdam valt buiten deze cao; RET Streekvervoer valt er wel onder.","facts":[{"value":"14 OKT","label":"Aangekondigde stakingsdag"},{"value":"CA. 13.000","label":"Werknemers onder deze cao"}],"source":{"url":"https://www.cnv.nl/nieuws/woensdag-14-oktober-landelijke-staking-busvervoer/","label":"Bron · CNV · 9 okt ↗"},"image":{"src":"https://cnvstorageprd.blob.core.windows.net/media/images/211026-H2-Bus-Arriv.3abd391d.fill-1920x1080.format-webp.webp","alt":"Arriva-bus, de foto bij de stakingsaankondiging van CNV"}},{"n":2,"category":"SPORT HEADLINES","headline":"Drie Nederlandse skaters naar WK in Paraguay","summary_html":"Het <strong>WK Inlineskaten begint zaterdag 10 oktober</strong> in Asunción en duurt tot 18 oktober. Lianne van Loon, Nikki Noordergraaf en Amber van der Meijden vertegenwoordigen Nederland. Volgens de vooruitblik van Schaatsen.nl van 9 oktober doen 406 atleten uit 47 landen mee. De wedstrijden zijn te volgen via Worldskate.tv.","facts":[{"value":"10–18 OKT","label":"Wereldkampioenschap"},{"value":"3 RIJDSTERS","label":"Nederlandse selectie"}],"source":{"url":"https://www.schaatsen.nl/nieuws/wat-moet-je-weten-over-het-wk-inlineskaten-2026/","label":"Bron · Schaatsen.nl · 9 okt ↗"},"image":{"src":"https://www.schaatsen.nl/media/images/55546387925_d31231799.2e16d0ba.fill-864x870.format-webp.webp","alt":"Amber van der Meijden, Lianne van Loon en Nikki Noordergraaf, foto Neeke Smit"}},{"n":3,"category":"FILM & FESTIVALS","headline":"LIFF is begonnen: elf dagen film in Leiden","summary_html":"Het <strong>Leiden International Film Festival</strong> is op donderdag 8 oktober begonnen en loopt tot en met zondag 18 oktober. De festivalwebsite bevestigt dat het programma online staat. Elf dagen lang zijn er premières, speciale vertoningen en activiteiten, met films van arthouse tot blockbuster. Controleer in het programma de actuele vertoningstijden en ticketbeschikbaarheid.","facts":[{"value":"8–18 OKT","label":"Festival in Leiden"},{"value":"11 DAGEN","label":"Films en activiteiten"}],"source":{"url":"https://www.liff.nl/","label":"Bron · LIFF · editie 2026 ↗"},"image":{"src":"https://www.liff.nl/wp-content/uploads/2024/10/audience-photo.png","alt":"Festivalpubliek bij LIFF, archiefbeeld van de officiële festivalwebsite"}},{"n":4,"category":"TECHNOLOGIE & GADGETS","headline":"OPPO kondigt Find X10 aan voor 21 oktober","summary_html":"OPPO heeft op 8 oktober de <strong>wereldwijde presentatie van de Find X10-serie</strong> aangekondigd voor 21 oktober op Mallorca. Volgens de fabrikant krijgt de Pro Max drie camera’s van 200 megapixel en samenwerking met Hasselblad. De volledige specificaties, prijzen en beschikbaarheid volgen bij de presentatie.","facts":[{"value":"21 OKT","label":"Wereldwijde presentatie"},{"value":"3 × 200 MP","label":"Camera’s Pro Max volgens OPPO"}],"source":{"url":"https://www.oppo.com/en/newsroom/press/oppo-findx10series-upcoming-launch/","label":"Bron · OPPO · 8 okt ↗"},"image":{"src":"https://www.oppo.com/content/dam/oppo_com/en/mkt/newsroom/press/2026/9/oppo-findx10series-upcoming-launch/KV-header.webp","alt":"Promotiebeeld van de OPPO Find X10-serie bij de officiële aankondiging"}},{"n":5,"category":"AI HEADLINES","headline":"Microsoft brengt CRM en AI-agenten naar Teams","summary_html":"Microsoft kondigde op 8 oktober <strong>dertig nieuwe Copilot-vaardigheden</strong> voor Dynamics 365 aan. Ze ondersteunen onder meer verkoop, klantvragen en marketing en zijn beschikbaar in Cowork. Daarnaast komt klantinformatie rechtstreeks in Teams-gesprekken. Die Teams-integratie is in openbare testfase; uitgebreidere autonome Service Agent-functies worden voorlopig met een beperkte groep klanten getest.","facts":[{"value":"30 SKILLS","label":"Nieuwe Copilot-vaardigheden"},{"value":"TESTFASE","label":"CRM-integratie in Teams"}],"source":{"url":"https://www.microsoft.com/en-us/copilot/blog/2026/10/08/bringing-crm-into-the-flow-of-work-and-agents-into-business-process-for-sales-and-service-teams/","label":"Bron · Microsoft · 8 okt ↗"},"image":{"src":"https://www.microsoft.com/en-us/copilot/blog/wp-content/uploads/sites/2/2026/10/CRM-flow-of-work-8.jpg","alt":"Microsoft-promotiebeeld bij de nieuwe CRM- en AI-agentfuncties"}},{"n":6,"category":"WATERSPORT","headline":"Inclusief zeil-WK in Portimão nadert slotdag","summary_html":"De <strong>World Sailing Inclusion Championships</strong> in Portimão lopen van 5 tot en met zaterdag 10 oktober. World Sailing meldde op 4 oktober een recorddeelname van 222 sporters uit 40 landen. In negen disciplines komen zeilers met uiteenlopende beperkingen en achtergronden samen. De wedstrijden maken deel uit van de campagne voor terugkeer van zeilen op de Paralympische Spelen.","facts":[{"value":"222 SPORTERS","label":"Deelname volgens World Sailing"},{"value":"40 LANDEN","label":"Vertegenwoordigd in Portimão"}],"source":{"url":"https://www.sailing.org/2026/10/04/portimao-welcomes-record-field-for-2026-world-sailing-inclusion-championships/","label":"Bron · World Sailing · 4 okt ↗"},"image":{"src":"https://www.sailing.org/wp-content/uploads/2026/10/041026_WSIC26_Portimao_GM__7RV2094-1-scaled.jpg","alt":"Deelnemer bij de World Sailing Inclusion Championships 2026 in Portimão"}},{"n":7,"category":"GWW","headline":"Suurhoffbrug richting Rotterdam vannacht dicht","summary_html":"Rijkswaterstaat meldde op 8 oktober dat de werkzaamheden bij de Suurhoffbrug uitlopen. Richting Rotterdam blijft op vrijdag tot 20.00 uur één rijstrook open. Daarna is de nieuwe brug <strong>van 9 oktober 20.00 tot 10 oktober 05.00 uur</strong> afgesloten tussen oprit 8 en afrit 9. Het verkeer wordt via de N218 omgeleid; richting Maasvlakte blijft de vluchtstrookroute gelden.","facts":[{"value":"20:00–05:00","label":"Afsluiting nacht 9 op 10 oktober"},{"value":"N218","label":"Omleiding richting Rotterdam"}],"source":{"url":"https://www.rijkswaterstaat.nl/nieuws/archief/2026/10/reservenacht-werkzaamheden-bij-suurhoffbrug-a15-nodig","label":"Bron · Rijkswaterstaat · 8 okt ↗"},"image":{"src":"https://rijkswaterstaat.imgix.net/suurhoffbrug-boven_tcm26-358004.jpeg","alt":"Luchtfoto van de Suurhoffbruggen bij het Hartelkanaal, Rijkswaterstaat"}},{"n":8,"category":"ROTTERDAM HEADLINES","headline":"Natuurplan biedt haven perspectief op vergunningen","summary_html":"Zuid-Holland meldde op 8 oktober een gezamenlijke routekaart voor <strong>natuurherstel en vergunningverlening</strong> rond de Rotterdamse haven. Het kabinet stelt 50 miljoen euro voor extra natuurmaatregelen voor. Als onderzoek, beheerplannen en maatregelen volgens planning worden uitgewerkt, kan vanaf begin 2027 een deel van de vergunningverlening hervatten. De aanpak geeft geen garantie voor individuele vergunningen.","facts":[{"value":"€50 MLN","label":"Voorgesteld voor natuurmaatregelen"},{"value":"BEGIN 2027","label":"Beoogde gedeeltelijke hervatting"}],"source":{"url":"https://www.zuid-holland.nl/actueel/nieuws/oktober-2026/gezamenlijke-aanpak-natuur-stikstof-zet-deur-kier/","label":"Bron · Zuid-Holland · 8 okt ↗"},"image":{"src":"https://www.zuid-holland.nl/publish/pages/39479/172px/robert-tieman-arne-weverling.jpg","alt":"Gedeputeerden Robert Tieman en Arne Weverling, foto bij de provinciale aankondiging"}},{"n":9,"category":"MUZIEK & CONCERTEN","headline":"La Mer vanavond met live orkest in Luxor","summary_html":"<strong>La Mer gaat vrijdag 9 oktober om 20.00 uur</strong> in première in het Nieuwe Luxor. Scapino Ballet Rotterdam combineert dans en videokunst met live muziek van het Rotterdams Philharmonisch Orkest en Laurens Collegium, onder leiding van Barbara Hannigan. De premièrevoorstelling duurt volgens Luxor tot 21.30 uur. De reeks loopt tot en met zondag 11 oktober.","facts":[{"value":"20:00–21:30","label":"Première op 9 oktober"},{"value":"€45–€89","label":"Gepubliceerde ticketprijzen"}],"source":{"url":"https://luxortheater.nl/agenda/la-mer-58757","label":"Bron · Luxor · 9–11 okt ↗"},"image":{"src":"https://luxortheater.nl/_next/image?q=100&url=https%3A%2F%2Fbackend.luxortheater.nl%2Fapp%2Fuploads%2F2026%2F04%2FScapino_La_Mer_by_Jubal_Battisti_0140-591x394.jpg&w=1920","alt":"Scapino Ballet Rotterdam in La Mer, foto Jubal Battisti"}},{"n":10,"category":"WEER ROTTERDAM","headline":"Rotterdam: natte vrijdag, later meer buien","summary_html":"Volgens het weerbericht van 9 oktober is het in het westen bewolkt met perioden van regen. De regionale middagtemperatuur ligt rond <strong>16 tot 17 graden</strong>. Vanavond wordt de regen buiiger en blijft het stevig waaien. Zaterdag volgen opnieuw buien en in het land maxima van 14 tot 15 graden. De zwaarste buien worden vooral in het noorden verwacht.","facts":[{"value":"16–17 °C","label":"Vrijdagmiddag in het westen"},{"value":"14–15 °C","label":"Landelijke maxima zaterdag"}],"source":{"url":"https://www.weeronline.nl/weerbericht-nederland","label":"Bron · Weeronline · 9 okt ↗"},"image":{"src":"https://cdn.weeronline.nl/7u0AHVBDG4q6eLjZwPDkxc/f5a8ff99b4b5c3e6c87d3fb929bdea5e/Herfstwandeling.jpg?fm=jpg&q=80","alt":"Herfstwandeling met paraplu, illustratie bij het actuele weekendweerbericht van Weeronline"}}]};
