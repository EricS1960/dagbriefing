<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Dagbriefing JSON-test</title></head><body><h1>Dagbriefing JSON-test</h1><div id="meta"></div><ol id="cards"></ol><script>fetch('briefing-test.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('meta').textContent=d.generated_at+' | '+d.deployment;document.getElementById('cards').innerHTML=d.cards.map(c=>'<li>'+c.n+'/10 · '+c.category+' — '+c.headline+'</li>').join('')}).catch(e=>document.getElementById('meta').textContent='FOUT '+e)</script></body></html>
